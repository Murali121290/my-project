server {
    listen 80;
    server_name pph.s4carlisle.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name pph.s4carlisle.com 10.1.1.69 localhost;

    ssl_certificate /etc/letsencrypt/live/pph.s4carlisle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pph.s4carlisle.com/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Increase body size for large file uploads
    client_max_body_size 50M;
    client_body_timeout 3600s;
    client_header_timeout 3600s;
    keepalive_timeout 3600s;

    location / {
        proxy_pass http://hub_web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long processing
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout          3600s;
    }

    location /static {
        alias /app/static;
    }

    location /media {
        alias /app/S4C-Processed-Documents;
    }

    # Alttext UI pages — served by my-project Flask
    location /alttext/ {
        proxy_pass http://hub_web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout       3600s;
    }

    # Alttext API proxy — my-project Flask forwards to alttext_app internally
    location /alttext-api/ {
        proxy_pass http://hub_web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 200M;

        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout       3600s;
    }
}

# 3. Redirect HTTP for Inkflow to HTTPS
server {
    listen 80;
    server_name inkflow.s4carlisle.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 4. Proxy HTTPS for Inkflow to CMS server (10.1.1.18)
server {
    listen 443 ssl;
    server_name inkflow.s4carlisle.com;

    # SSL Certificate Paths on the PPH Server
    ssl_certificate /etc/letsencrypt/live/inkflow.s4carlisle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inkflow.s4carlisle.com/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Allow large file uploads matching CMS backend requirements
    client_max_body_size 10G;

    # ── WebDAV (MS Word desktop open/save) ───────────────────────────────────
    # Word opens files via ms-word:ofe|u|<url> and then issues PROPFIND/LOCK/GET/PUT.
    # Must proxy ALL HTTP methods including PROPFIND, LOCK, UNLOCK.
    location ^~ /webdav/ {
        proxy_pass         https://10.1.1.18:443;
        proxy_ssl_verify   off;
        proxy_set_header   Host             $http_host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    300s;
        proxy_connect_timeout  60s;
        proxy_send_timeout    300s;
        # Pass body unchanged for PUT (save back) - critical to avoid hangs
        proxy_request_buffering off;
    }

    # ── WOPI (LibreOffice Online callbacks) ───────────────────────────────────
    # Collabora calls back to /wopi/files/... to read/write documents.
    location ^~ /wopi/ {
        proxy_pass         https://10.1.1.18:443;
        proxy_ssl_verify   off;
        proxy_set_header   Host             $http_host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    300s;
        proxy_connect_timeout  60s;
        proxy_send_timeout    300s;
    }

    location / {
        proxy_pass https://10.1.1.18:443;
        proxy_ssl_verify off; # Trust self-signed or bootstrap certs on CMS server
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets support for Collabora Online editor
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for document editing and processing
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout          3600s;
    }
}
