{% extends "base.html" %}

{% block title %}Change Password - Admin{% endblock %}

{% block extra_css %}
<style>
    .page-header { margin-bottom: 24px; }
    .page-title  { font-size: 1.5rem; font-weight: 700; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    .page-sub    { font-size: 0.85rem; color: rgba(255,255,255,0.7); margin-top: 4px; }

    .content-card {
        background: rgba(255,255,255,0.97);
        border-radius: 14px;
        padding: 32px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.13);
        max-width: 520px;
        animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

    .card-title {
        font-size: 1rem; font-weight: 700; color: #1a1f3a;
        margin-bottom: 24px; padding-bottom: 10px;
        border-bottom: 2px solid #f0f2f8;
        display: flex; align-items: center; gap: 8px;
    }

    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 0.83rem; font-weight: 600; color: #444; margin-bottom: 6px; }
    .form-control {
        width: 100%; padding: 10px 14px; border: 1.5px solid #e0e4f0;
        border-radius: 8px; font-size: 0.875rem; font-family: inherit;
        transition: border-color 0.18s; background: #fff;
    }
    .form-control:focus { outline: none; border-color: #4361ee; box-shadow: 0 0 0 3px rgba(67,97,238,0.1); }

    .form-actions { display: flex; justify-content: space-between; align-items: center; padding-top: 8px; }
</style>
{% endblock %}

{% block content %}
<div class="fade-in">

    <div class="page-header">
        <div class="page-title">Change Password</div>
        <div class="page-sub">Update the password for <strong style="color:rgba(255,255,255,0.9)">{{ user['username'] }}</strong></div>
    </div>

    <div class="content-card">
        <div class="card-title">
            <i class="fas fa-key" style="color:#4361ee"></i> Set New Password
        </div>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="new_password" class="form-label">New Password <span style="color:#ef476f">*</span></label>
                <input type="password" class="form-control" id="new_password" name="new_password" required placeholder="Min 8 characters">
            </div>

            <div class="form-actions">
                <a href="{{ url_for('admin_users') }}" class="btn btn-outline">
                    <i class="fas fa-arrow-left"></i> Back to Users
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-key"></i> Update Password
                </button>
            </div>
        </form>
    </div>

</div>
{% endblock %}
